# CallMeMaybe - Shopify App Configuration
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6938bd7b8b68a62d336d214686fad27f"
name = "CallMeMaybe"
application_url = "https://callmemaybe-hackathon.onrender.com"
embedded = true

[access_scopes]
# Required scopes for CallMeMaybe
# read_orders, write_orders - order-scoped support context and merchant-approved actions
# read_legal_policies - store policies for knowledge sync
scopes = "read_orders,write_orders,read_legal_policies"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]


[auth]
redirect_urls = [ "https://callmemaybe-hackathon.onrender.com/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
