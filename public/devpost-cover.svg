<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CallmeMaybe — phone work for Shopify, safely resolved</title>
  <desc id="desc">Branded project cover showing a carrier call becoming a structured, approval-gated Shopify action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#effcf8"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#a99ff8" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#6657eb" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6657eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d6ff0"/>
      <stop offset="1" stop-color="#5144d1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#252346" flood-opacity=".14"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#6657eb" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="32" fill="url(#grid)"/>
  <circle cx="955" cy="305" r="330" fill="url(#orb)"/>

  <g transform="translate(70 60)">
    <rect width="48" height="48" rx="15" fill="url(#mark)"/>
    <path d="M14 16.5h20v12.6a6.4 6.4 0 0 1-6.4 6.4h-1.7l-5.1 4v-4H20a6 6 0 0 1-6-6z" fill="#fff"/>
    <path d="M19 21.5c1.7 4.3 4.6 7.2 9 9l2.2-2.2c.4-.4.9-.5 1.4-.3l2.4.8v.7a4.2 4.2 0 0 1-4.2 4.2A15.5 15.5 0 0 1 14.3 18a4.2 4.2 0 0 1 4.2-4.2h.7l.8 2.4c.2.5.1 1-.3 1.4z" fill="#30cba2" transform="scale(.62) translate(16 18)"/>
    <text x="63" y="33" font-family="Arial" font-size="26" font-weight="760" letter-spacing="-1.1" fill="#101828">Callme<tspan fill="#6657eb">Maybe</tspan></text>
  </g>

  <g transform="translate(70 169)">
    <rect width="208" height="29" rx="14.5" fill="#e6fbf5"/>
    <circle cx="17" cy="14.5" r="4" fill="#30cba2"/>
    <text x="29" y="19" font-family="Arial" font-size="11" font-weight="750" letter-spacing="1.25" fill="#08765b">BUILT WITH CALL-E + SHOPIFY</text>

    <text y="92" font-family="Arial" font-size="64" font-weight="790" letter-spacing="-4.2" fill="#101828">Phone work for stores,</text>
    <text y="159" font-family="Arial" font-size="64" font-weight="790" letter-spacing="-4.2" fill="#6657eb">safely resolved.</text>
    <text y="207" font-family="Arial" font-size="18" font-weight="450" fill="#5f6b7a">Call carriers. Reach customers. Turn conversations into</text>
    <text y="234" font-family="Arial" font-size="18" font-weight="450" fill="#5f6b7a">audited, policy-gated order actions.</text>

    <g transform="translate(0 278)">
      <rect width="164" height="46" rx="13" fill="#6657eb"/>
      <text x="21" y="29" font-family="Arial" font-size="13" font-weight="730" fill="#fff">EVIDENCE → ACTION</text>
      <text x="187" y="28" font-family="Arial" font-size="12" font-weight="650" fill="#101828">Deterministic policy · Human approval · Drift protection</text>
    </g>
  </g>

  <g transform="translate(745 95) rotate(-2 190 210)" filter="url(#shadow)">
    <rect width="382" height="264" rx="24" fill="#fff" stroke="#e3e3ef"/>
    <rect x="22" y="22" width="46" height="46" rx="14" fill="#6657eb"/>
    <text x="39" y="53" font-family="Arial" font-size="22" font-weight="800" fill="#fff">R</text>
    <text x="82" y="42" font-family="Arial" font-size="14" font-weight="750" fill="#101828">Riley is calling</text>
    <text x="82" y="60" font-family="Arial" font-size="10.5" fill="#687385">Northline Freight · 02:18</text>
    <rect x="312" y="31" width="48" height="22" rx="11" fill="#e0fbf3"/>
    <text x="324" y="46" font-family="Arial" font-size="9" font-weight="800" letter-spacing="1" fill="#08765b">LIVE</text>
    <rect x="22" y="88" width="338" height="102" rx="17" fill="#f7f6ff"/>
    <g transform="translate(77 139)" stroke="#6657eb" stroke-width="6" stroke-linecap="round">
      <path d="M0-12v24M22-24v48M44-16v32M66-34v68M88-22v44M110-42v84M132-26v52M154-36v72M176-17v34M198-29v58M220-11v22"/>
    </g>
    <text x="191" y="224" text-anchor="middle" font-family="Arial" font-size="12" fill="#687385">“I can wait while you open the package trace.”</text>
  </g>

  <g transform="translate(828 380) rotate(2 150 80)" filter="url(#shadow)">
    <rect width="314" height="166" rx="21" fill="#fff" stroke="#e3e3ef"/>
    <circle cx="34" cy="34" r="13" fill="#e3fbf4"/>
    <path d="m28 34 4 4 8-9" fill="none" stroke="#08765b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="39" font-family="Arial" font-size="13" font-weight="760" fill="#101828">Structured result</text>
    <path d="M20 59h274" stroke="#ececf3"/>
    <text x="23" y="83" font-family="Arial" font-size="10" fill="#687385">TRACE</text>
    <text x="291" y="83" text-anchor="end" font-family="Arial" font-size="11" font-weight="700" fill="#101828">NL-884219</text>
    <text x="23" y="110" font-family="Arial" font-size="10" fill="#687385">DISPOSITION</text>
    <text x="291" y="110" text-anchor="end" font-family="Arial" font-size="11" font-weight="700" fill="#101828">Investigation opened</text>
    <text x="23" y="137" font-family="Arial" font-size="10" fill="#687385">POLICY</text>
    <text x="291" y="137" text-anchor="end" font-family="Arial" font-size="11" font-weight="700" fill="#9b6500">Merchant approval</text>
  </g>

  <g transform="translate(70 571)">
    <circle cx="7" cy="7" r="7" fill="#101828"/>
    <path d="m4 7 2 2 4-5" fill="none" stroke="#30cba2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="23" y="11" font-family="Arial" font-size="11" font-weight="650" fill="#5f6b7a">Model out of authorization</text>
    <circle cx="206" cy="7" r="7" fill="#101828"/>
    <path d="m203 7 2 2 4-5" fill="none" stroke="#30cba2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="222" y="11" font-family="Arial" font-size="11" font-weight="650" fill="#5f6b7a">Encrypted transcripts</text>
    <circle cx="384" cy="7" r="7" fill="#101828"/>
    <path d="m381 7 2 2 4-5" fill="none" stroke="#30cba2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="11" font-family="Arial" font-size="11" font-weight="650" fill="#5f6b7a">Shopify re-read before write</text>
  </g>
</svg>
